services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    expose:
      - "3000"

  # HTTPS automático con Let's Encrypt. Necesita que el dominio apunte a la IP del VPS
  # y que los puertos 80 y 443 estén libres.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_datos:
  caddy_config:
